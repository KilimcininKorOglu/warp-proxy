# warp-proxy configuration.
# Panel listener (admin web UI).
panel:
  listen: ":8590"

# Client facing proxies. Every connection goes out through WARP.
http_proxy:
  listen: ":8591"
socks_proxy:
  listen: ":8592"

# Built-in MASQUE tunnel (no warp-cli).
warp:
  state_dir: "state"            # device identities, persisted across restarts
  accounts: 1                   # >1 enables the multi-account pool; needs a restart
  reconnect_mode: "reconnect"   # or "reregister" (delete + fresh registration)
  distribution: "off"           # "round-robin" keeps every account's tunnel
                                # open and spreads requests per request; restart
  ipv6_preference: "off"        # "prefer" exits AAAA targets via WARP IPv6;
                                # "only" resolves AAAA only; applies live

# Periodic check through the WARP tunnel. Generic by default; add bot
# markers only if your use case needs marker detection (for example the
# YouTube check). An empty marker list means only transport errors and
# warp=off count as failures.
health:
  enabled: true
  interval: "5m"
  timeout: "30s"
  url: "https://www.cloudflare.com/cdn-cgi/trace"
  trace_url: "https://www.cloudflare.com/cdn-cgi/trace"
  bot_markers: []

# Reconnect rate limiting.
reconnect:
  min_interval: "60s"
  max_consecutive: 5
  cooldown_after_burst: "10m"

# Clean-IP scanner: TCP latency from this host to candidate Cloudflare
# edge IPs; the winner can be pinned as the WARP tunnel endpoint.
cleanip:
  port: 443
  samples_per_range: 4
  workers: 50
  timeout: "2s"
  top: 20

# Front IP rewriting: connect Cloudflare-fronted targets through the
# fastest scanned edge IPs. Needs a Clean-IP scan to fill the pool.
front:
  enabled: false
  domains: []            # extra suffixes always fronted, e.g. ["example.com"]
  resolve_cache_ttl: "10m"

# AI bridge: an OpenAI-compatible reverse proxy that forwards requests to
# the upstream through WARP. A retryable status is replayed: only a 429 whose
# body is a FreeUsageLimitError rotates the WARP exit IP first, while any
# other retryable status is retried on the same IP after Retry-After (5 s when
# absent). Point the AI client's baseURL at http://<host>:8593/v1.
bridge:
  enabled: true
  listen: ":8593"
  upstream: "https://opencode.ai/zen"
  retry_statuses: [429]
  retry_attempts: 1
  max_concurrent: 3
  min_interval: "0.5s"
  timeout: "120s"
  # Free-tier identity: add X-Opencode-Session, X-Opencode-Request, an
  # opencode User-Agent and stub tool entries to upstream requests that do
  # not already carry them. Values sent by the client are respected.
  inject_session: true
  # On a 429 rotation, also refresh the session/request ids (even if the
  # client sent them) so the replay carries a fresh identity. Costs the
  # replayed request its prompt-cache affinity.
  rotate_session_on_retry: true

# Public proxy fallback pool: scraped lists, verified with a real request;
# the bridge uses it only after the WARP retries are exhausted.
public_proxy:
  enabled: true
  interval: "30m"               # rescan cadence
  max: 100                      # verified proxies kept, fastest first
  workers: 100                  # concurrent check goroutines
  timeout: "10s"
  check_url: "http://www.cloudflare.com/cdn-cgi/trace"
  sources:
    - "https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/socks5.txt"
    - "https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/http.txt"
    - "https://sunny9577.github.io/proxy-scraper/generated/socks5_proxies.txt"
    - "https://sunny9577.github.io/proxy-scraper/generated/http_proxies.txt"
    - "https://raw.githubusercontent.com/berkay-digital/Proxy-Scraper/main/proxies.txt"

# Panel login. The password is written on first start from the
# WARP_PROXY_PASSWORD environment variable; only the bcrypt hash is stored.
auth:
  username: "admin"
