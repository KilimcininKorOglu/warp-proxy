# warp-proxy configuration.
# Panel listener (admin web UI).
panel:
  listen: ":8590"

# Client facing proxies. Every connection goes out through WARP.
http_proxy:
  listen: ":8591"
socks_proxy:
  listen: ":8592"

# warp-cli driver.
warp:
  binary: "warp-cli"
  cli_args: ["--accept-tos"]   # required in non-interactive environments
  proxy_addr: "127.0.0.1:40000"
  reconnect_mode: "reconnect"   # or "reregister"

# Periodic check through the WARP tunnel. Generic by default; add bot
# markers only if your use case needs marker detection (for example the
# YouTube check). An empty marker list means only transport errors and
# warp=off count as failures.
health:
  enabled: true
  interval: "5m"
  timeout: "30s"
  url: "https://www.cloudflare.com/cdn-cgi/trace"
  trace_url: "https://www.cloudflare.com/cdn-cgi/trace"
  bot_markers: []

# Reconnect rate limiting.
reconnect:
  min_interval: "60s"
  max_consecutive: 5
  cooldown_after_burst: "10m"

# Clean-IP scanner: TCP latency from this host to candidate Cloudflare
# edge IPs; the winner can be pinned as the WARP tunnel endpoint.
cleanip:
  port: 443
  samples_per_range: 4
  workers: 50
  timeout: "2s"
  top: 20

# Front IP rewriting: connect Cloudflare-fronted targets through the
# fastest scanned edge IPs. Needs a Clean-IP scan to fill the pool.
front:
  enabled: false
  domains: []            # extra suffixes always fronted, e.g. ["example.com"]
  resolve_cache_ttl: "10m"

# AI bridge: an OpenAI-compatible reverse proxy that forwards requests to
# the upstream through WARP and replays after a WARP IP rotation when the
# upstream answers with a retryable status (429). Point the AI client's
# baseURL at http://<host>:8593/v1.
bridge:
  enabled: true
  listen: ":8593"
  upstream: "https://opencode.ai/zen"
  retry_statuses: [429]
  retry_attempts: 1
  max_concurrent: 3
  min_interval: "0.5s"
  timeout: "120s"
  # Free-tier identity: add X-Opencode-Session, X-Opencode-Request, an
  # opencode User-Agent and stub tool entries to upstream requests that do
  # not already carry them. Values sent by the client are respected.
  inject_session: true

# Panel login. The password is written on first start from the
# WARP_PROXY_PASSWORD environment variable; only the bcrypt hash is stored.
auth:
  username: "admin"
